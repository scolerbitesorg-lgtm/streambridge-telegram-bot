services:
  - type: web
    name: streambridge-telegram-bot
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 7860
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_STRING_SESSION
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
